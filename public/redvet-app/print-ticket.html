<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <title></title>
  <style>
    @page {
      margin: 0;
      size: 58mm auto;
      @top-left { content: ""; }
      @top-center { content: ""; }
      @top-right { content: ""; }
      @bottom-left { content: ""; }
      @bottom-center { content: ""; }
      @bottom-right { content: ""; }
    }
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
    }
    img {
      display: block;
      border: 0;
      margin: 0;
      padding: 0;
      width: 58mm;
      max-width: 58mm;
      height: auto;
    }
    @media print {
      @page {
        margin: 0;
        size: 58mm auto;
        @top-left { content: ""; }
        @top-center { content: ""; }
        @top-right { content: ""; }
        @bottom-left { content: ""; }
        @bottom-center { content: ""; }
        @bottom-right { content: ""; }
      }
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      img {
        width: 58mm !important;
        max-width: 58mm !important;
        height: auto !important;
        page-break-before: avoid;
        page-break-after: avoid;
        page-break-inside: avoid;
      }
    }
    .error {
      font: 14px sans-serif;
      padding: 16px;
      color: #333;
    }
  </style>
</head>
<body>
  <img id="ticket" alt="" />
  <script>
    (function () {
      var STORAGE_KEY = "redvet_ticket_print_png";

      function cleanup() {
        try { window.close(); } catch (e) {}
      }

      function doPrint() {
        window.onafterprint = cleanup;
        setTimeout(function () {
          window.focus();
          window.print();
          setTimeout(cleanup, 15000);
        }, 200);
      }

      var b64 = sessionStorage.getItem(STORAGE_KEY);
      sessionStorage.removeItem(STORAGE_KEY);
      if (!b64) {
        document.body.innerHTML =
          '<p class="error">No hay ticket para imprimir. Vuelve a la app e inténtalo de nuevo.</p>';
        return;
      }

      var img = document.getElementById("ticket");
      img.src = "data:image/png;base64," + b64;
      if (img.complete && img.naturalWidth > 0) {
        doPrint();
      } else {
        img.onload = doPrint;
        img.onerror = function () {
          document.body.innerHTML =
            '<p class="error">No se pudo cargar el ticket.</p>';
        };
      }
    })();
  </script>
</body>
</html>
